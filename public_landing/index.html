<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Cuenta Verificada! | Luia</title>
    <style>
        :root {
            --brand-color: #6214A4; /* El violeta de tu logo */
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .logo {
            width: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: var(--brand-color);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #4c107e;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://firebasestorage.googleapis.com/v0/b/luia-48689.firebasestorage.app/o/static%2Flogo_luia.png?alt=media&token=4a4d1ad1-636d-4169-bdbc-3102b5dca6a0" alt="Luia Logo" class="logo">
        
        <h1>¡Todo listo!</h1>
        <p>Tu correo ha sido verificado correctamente. Ya puedes empezar a consumir de forma más inteligente.</p>
        
        <a href="https://www.luia.app" class="btn">Entrar a Luia</a>

        <div class="footer">
            &copy; 2026 Luia. Menos es más.
        </div>
    </div>

    <script>
        // Opcional: Redirección automática tras 5 segundos
        /*
        setTimeout(() => {
            window.location.href = "https://www.luia.app";
        }, 5000);
        */
    </script>
</body>
</html>
